<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Menu | DosaLane Lucknow Chowk</title>
<link rel="icon" href="images/DosaLaneLogo.jpeg" type="image/jpeg">
<link rel="apple-touch-icon" href="images/DosaLaneLogo.jpeg">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">


</head>

<body>

<main class="container menu-container">


<!-- Back Button -->
<a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
    Back
</a>

<header class="menu-header">
    <div class="logo menu-logo">
        <img src="images/DosaLaneLogo.jpeg" alt="DosaLane Logo">
    </div>
    <h1>🍽️ Our Menu</h1>
</header>

<!-- Book -->
<div class="menu-book">

    <!-- Previous Button -->
    <button class="page-btn prev-btn" type="button" aria-label="Previous menu page" aria-controls="menuPage">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <!-- Page -->
    <div class="menu-page" id="menuPage">
        <img
            id="menuImage"
            src="images/menu-1.png"
            alt="DosaLane Menu Page 1"
            decoding="async"
        >
    </div>

    <!-- Next Button -->
    <button class="page-btn next-btn" type="button" aria-label="Next menu page" aria-controls="menuPage">
        <i class="fa-solid fa-chevron-right"></i>
    </button>

</div>

<div class="menu-tools" role="group" aria-label="Menu zoom controls">
    <button class="zoom-btn" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out" disabled>
        <i class="fa-solid fa-minus" aria-hidden="true"></i>
    </button>
    <button class="zoom-reset" id="zoomReset" type="button" aria-label="Reset zoom" title="Reset zoom" disabled>
        <span id="zoomLevel">100%</span>
    </button>
    <button class="zoom-btn" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
    </button>
</div>
<p class="menu-help">Use the arrows or swipe to change pages. When zoomed in, drag the menu to explore it.</p>

<!-- Page Counter -->
<div class="page-counter" aria-live="polite" aria-atomic="true">
    Page <span id="pageNumber">1</span> of <span id="totalPages">16</span>
</div>

<!-- Visit Us -->
<a class="button"
   href="https://maps.app.goo.gl/YyJaqDy7BtWkkEZb9"
   target="_blank"
   rel="noopener noreferrer">

    <i class="fa-solid fa-location-dot"></i>
    Visit Us

</a>

</main>

<script>

    let currentPage = 1;
    const totalPages = 16;

    const menuImage = document.getElementById("menuImage");
    const pageNumber = document.getElementById("pageNumber");
    const previousButton = document.querySelector(".prev-btn");
    const nextButton = document.querySelector(".next-btn");
    const zoomInButton = document.getElementById("zoomIn");
    const zoomOutButton = document.getElementById("zoomOut");
    const zoomResetButton = document.getElementById("zoomReset");
    const zoomLevel = document.getElementById("zoomLevel");
    const menuPage = document.getElementById("menuPage");
    const minZoom = 1;
    const maxZoom = 2.5;
    const zoomStep = 0.25;
    let zoom = minZoom;

    function showPage(page) {

        if (page < 1 || page > totalPages) {
            return;
        }

        currentPage = page;

        menuImage.src = `images/menu-${currentPage}.png`;
        menuImage.alt = `DosaLane Menu Page ${currentPage}`;

        pageNumber.textContent = currentPage;
        previousButton.disabled = currentPage === 1;
        nextButton.disabled = currentPage === totalPages;
        setZoom(minZoom);

        const adjacentPage = currentPage < totalPages ? currentPage + 1 : currentPage - 1;
        const preloadImage = new Image();
        preloadImage.src = `images/menu-${adjacentPage}.png`;
    }

    previousButton.addEventListener("click", previousPage);
    nextButton.addEventListener("click", nextPage);
    zoomInButton.addEventListener("click", function() {
        setZoom(zoom + zoomStep);
    });
    zoomOutButton.addEventListener("click", function() {
        setZoom(zoom - zoomStep);
    });
    zoomResetButton.addEventListener("click", function() {
        setZoom(minZoom);
    });

    showPage(currentPage);

    function nextPage() {

        if (currentPage < totalPages) {
            showPage(currentPage + 1);
        }

    }

    function previousPage() {

        if (currentPage > 1) {
            showPage(currentPage - 1);
        }

    }

    function setZoom(nextZoom) {

        zoom = Math.min(maxZoom, Math.max(minZoom, Math.round(nextZoom * 100) / 100));
        menuPage.style.setProperty("--menu-zoom", `${Math.round(zoom * 100)}%`);
        zoomLevel.textContent = `${Math.round(zoom * 100)}%`;

        zoomOutButton.disabled = zoom <= minZoom;
        zoomInButton.disabled = zoom >= maxZoom;
        zoomResetButton.disabled = zoom === minZoom;

        if (zoom === minZoom) {
            menuPage.scrollLeft = 0;
            menuPage.scrollTop = 0;
        }

        menuPage.classList.toggle("is-zoomed", zoom > minZoom);

    }


    /* Keyboard Navigation */

    document.addEventListener("keydown", function(event) {

        if (event.target.matches("input, textarea, select, [contenteditable='true']")) {
            return;
        }

        if (event.key === "ArrowRight") {
            nextPage();
        }

        if (event.key === "ArrowLeft") {
            previousPage();
        }

    });


    /* Mobile Swipe */

    let touchStartX = 0;
    let touchEndX = 0;

    menuPage.addEventListener("touchstart", function(event) {

        touchStartX = event.changedTouches[0].screenX;

    });

    menuPage.addEventListener("touchend", function(event) {

        touchEndX = event.changedTouches[0].screenX;

        handleSwipe();

    });

    function handleSwipe() {

        if (zoom > minZoom) {
            return;
        }

        const swipeDistance = touchEndX - touchStartX;

        if (Math.abs(swipeDistance) < 50) {
            return;
        }

        if (swipeDistance < 0) {
            nextPage();
        } else {
            previousPage();
        }

    }

</script>

</body>
</html>
